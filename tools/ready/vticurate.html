<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTI Curation</title>
<style>
:root {
	--bg: #101219;
	--panel: #171a24;
	--card: #1d2130;
	--line: #2b3044;
	--text: #e8e9ef;
	--dim: #9096ab;
	--accent: #d97757;
	--good: #6fcf8f;
	--bad: #e06c6c;
	--warn: #e6b84c;
}
* { box-sizing: border-box; }
body {
	margin: 0; background: var(--bg); color: var(--text);
	font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	display: grid; grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr; height: 100vh;
}
header {
	grid-column: 1 / -1; display: flex; gap: 16px; align-items: center;
	padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; color: var(--accent); }
header .stats { color: var(--dim); }
header input[type=search] { margin-left: auto; width: 280px; }
#saved { color: var(--dim); min-width: 80px; text-align: right; }
input, textarea, select, button {
	font: inherit; color: var(--text); background: var(--bg);
	border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
button { cursor: pointer; background: var(--card); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a0f0a; font-weight: 600; }
nav { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px; }
nav .pack {
	display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px;
	cursor: pointer; border: 1px solid transparent;
}
nav .pack:hover { background: var(--card); }
nav .pack.selected { background: var(--card); border-color: var(--accent); }
nav .pack.drop { border-color: var(--good); background: #1f2a24; }
nav .pack .n { color: var(--dim); font-variant-numeric: tabular-nums; }
nav .pack.unassigned { font-style: italic; }
nav .new { width: 100%; margin: 8px 0; }
main { overflow-y: auto; padding: 16px 20px 60px; }
.packhead { display: grid; grid-template-columns: 1fr 220px 150px auto; gap: 10px; align-items: end; }
.packhead label { display: flex; flex-direction: column; gap: 3px; color: var(--dim); font-size: 12px; }
.packhead textarea { grid-column: 1 / -1; min-height: 64px; resize: vertical; }
.packhead .title { font-size: 18px; font-weight: 600; }
.hint { color: var(--dim); font-size: 12px; margin: 8px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.card {
	background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
	display: flex; flex-direction: column; gap: 6px;
}
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.dragging { opacity: 0.4; }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.thumbs figure { margin: 0; position: relative; aspect-ratio: 1; background: #0b0c11; border-radius: 6px; overflow: hidden; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
.thumbs figcaption {
	position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 5px;
	background: rgba(0,0,0,0.6); border-radius: 4px; color: var(--dim);
}
.thumbs .none { display: grid; place-items: center; height: 100%; color: var(--dim); font-size: 12px; padding: 8px; text-align: center; }
.name { font-weight: 600; word-break: break-all; font-size: 12.5px; cursor: grab; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
.badge { padding: 1px 6px; border-radius: 10px; background: #2a2f44; color: var(--text); }
.badge.excluded { background: #4a2228; color: #ffb3b3; }
.badge.pending { background: #3d3520; color: #ffe0a0; }
.row { display: flex; gap: 6px; align-items: center; }
.row select { flex: 1; min-width: 0; }
.row .send { white-space: nowrap; }
#toast {
	position: fixed; right: 16px; bottom: 16px; max-width: 520px; padding: 10px 14px;
	background: var(--panel); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap;
	opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.good { border-color: var(--good); }
#toast.bad { border-color: var(--bad); }
.selbar { position: sticky; top: -16px; z-index: 2; background: var(--bg); padding: 8px 0; display: none; gap: 8px; align-items: center; }
.selbar.show { display: flex; }
@media (max-width: 760px) {
	body { grid-template-columns: 1fr; grid-template-rows: auto 200px 1fr; }
	nav { border-right: 0; border-bottom: 1px solid var(--line); }
	.packhead { grid-template-columns: 1fr; }
	header { flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; }
	header .stats { order: 3; flex-basis: 100%; font-size: 12px; }
	header input[type=search] { flex: 1; width: auto; min-width: 0; }
	#saved { min-width: 0; }
	main { padding: 12px 12px 60px; }
	.packhead > * { min-width: 0; }
	.selbar { top: -12px; }
}
</style>
</head>
<body>
<header>
	<h1>VTI Curation</h1>
	<span class="stats" id="stats">loading…</span>
	<input type="search" id="filter" placeholder="Find shaders in every pack…">
	<span id="saved"></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
"use strict";
let state, packs, files, current = 0, selected = new Set(), saveTimer = null;
const UNASSIGNED = -1;
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
	const e = document.createElement(tag);
	for (const [k, v] of Object.entries(props)) {
		if (k === "class") e.className = v;
		else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
		else if (k in e && typeof v !== "string") e[k] = v;
		else e.setAttribute(k, v);
	}
	for (const kid of kids) if (kid != null) e.append(kid);
	return e;
};
const fraction = q => q == null ? "" : q >= 1 ? "1" : "1/" + Math.round(1 / q);
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const short = p => p.split("/").pop().replace(/\.vti$/, "");

function toast(text, kind = "") {
	const t = $("#toast");
	t.textContent = text;
	t.className = "show " + kind;
	clearTimeout(toast.timer);
	toast.timer = setTimeout(() => t.className = "", kind === "bad" ? 9000 : 4000);
}

function unassigned() {
	const used = new Set(packs.flatMap(p => p.paths));
	return Object.keys(files).filter(p => !used.has(p) && !(p in state.duplicates)).sort();
}

function changed() {
	$("#saved").textContent = "editing…";
	clearTimeout(saveTimer);
	saveTimer = setTimeout(save, 700);
}

async function save() {
	try {
		const r = await fetch("/api/packs", {method: "POST", body: JSON.stringify(packs)});
		if (!r.ok) throw new Error(r.status);
		$("#saved").textContent = "saved ✓";
	} catch (e) {
		$("#saved").textContent = "not saved!";
		toast("Couldn't save packs.json: " + e, "bad");
	}
}

function renderNav() {
	const nav = $("#nav");
	nav.textContent = "";
	nav.append(el("button", {class: "new", onclick: newPack}, "+ New pack"));
	const add = (i, title, n, extra = "") => {
		const row = el("div", {class: "pack " + extra + (i === current ? " selected" : ""),
				onclick: () => { current = i; selected.clear(); location.hash = i; render(); }},
			el("span", {}, title), el("span", {class: "n"}, String(n)));
		row.addEventListener("dragover", e => { e.preventDefault(); row.classList.add("drop"); });
		row.addEventListener("dragleave", () => row.classList.remove("drop"));
		row.addEventListener("drop", e => {
			e.preventDefault();
			row.classList.remove("drop");
			const paths = JSON.parse(e.dataTransfer.getData("text/plain"));
			moveTo(paths, i);
		});
		nav.append(row);
	};
	packs.forEach((p, i) => add(i, p.title || "(untitled)", p.paths.length));
	add(UNASSIGNED, "Not in a pack", unassigned().length, "unassigned");
	nav.querySelector(".selected")?.scrollIntoView({block: "nearest"});
}

function moveTo(paths, target) {
	for (const p of packs) p.paths = p.paths.filter(x => !paths.includes(x));
	if (target !== UNASSIGNED) packs[target].paths.push(...paths);
	selected.clear();
	changed();
	render();
	toast("Moved " + paths.length + " to " + (target === UNASSIGNED ? "Not in a pack" : packs[target].title));
}

function newPack() {
	packs.push({id: "new-pack-" + (packs.length + 1), title: "New pack", description: "", rule: "", paths: []});
	current = packs.length - 1;
	changed();
	render();
	$(".packhead .title")?.select();
}

function packOf(path) {
	return packs.findIndex(p => p.paths.includes(path));
}

function thumb(path, which, kind) {
	const fig = el("figure");
	if (kind === "excluded" || kind === "pending") {
		fig.append(el("div", {class: "none"}, kind === "pending" ? "not built yet" : "left out"));
	} else {
		const img = el("img", {loading: "lazy", alt: which, src: "/thumb/" + which + "?path=" + encodeURIComponent(path)});
		img.addEventListener("error", () => img.replaceWith(el("div", {class: "none"}, "couldn't render")));
		fig.append(img);
	}
	fig.append(el("figcaption", {}, which === "start" ? "start" : "warmed up"));
	return fig;
}

function card(path, pack) {
	const f = files[path] || {kind: "pending", why: "", grid: null};
	const qualities = pack ? (pack.qualities = pack.qualities || {}) : null;
	const c = el("div", {class: "card" + (selected.has(path) ? " selected" : ""), draggable: "true"});
	c.addEventListener("dragstart", e => {
		const paths = selected.has(path) ? [...selected] : [path];
		e.dataTransfer.setData("text/plain", JSON.stringify(paths));
		c.classList.add("dragging");
	});
	c.addEventListener("dragend", () => c.classList.remove("dragging"));
	c.addEventListener("click", e => {
		if (!e.shiftKey && !e.ctrlKey && !e.metaKey) return;
		selected.has(path) ? selected.delete(path) : selected.add(path);
		render();
	});
	c.append(el("div", {class: "thumbs"}, thumb(path, "start", f.kind), thumb(path, "warm", f.kind)));
	c.append(el("div", {class: "name", title: path}, short(path)));
	const meta = el("div", {class: "meta"},
		el("span", {class: "badge " + f.kind, title: f.why || ""}, f.kind),
		f.grid ? el("span", {}, f.grid[0] + "×" + f.grid[1]) : null,
		el("span", {}, f.rule));
	if (f.kind === "excluded") meta.append(el("span", {}, f.why));
	c.append(meta);
	const row = el("div", {class: "row"});
	if (pack) {
		const q = el("select", {title: "The resolution this shader starts at",
				onchange: () => {
					if (q.value === "") delete qualities[path]; else qualities[path] = +q.value;
					changed();
				}},
			el("option", {value: ""}, "pack's res"),
			...state.qualities.map(v => el("option", {value: String(v)}, fraction(v))));
		q.value = qualities[path] != null ? String(qualities[path]) : "";
		row.append(q);
	}
	const move = el("select", {title: "Move to another pack", onchange: () => moveTo([path], +move.value)},
		el("option", {value: "", disabled: true, selected: true}, "move to…"),
		...packs.map((p, i) => el("option", {value: String(i)}, p.title)),
		el("option", {value: String(UNASSIGNED)}, "Not in a pack"));
	row.append(move);
	const send = el("button", {class: "send", title: "Open it in Enki debug on the phone",
			disabled: f.kind === "excluded" || f.kind === "pending",
			onclick: () => push(path, pack, send)}, "📱 Send");
	row.append(send);
	c.append(row);
	return c;
}

async function push(path, pack, button) {
	const quality = (pack && pack.qualities && pack.qualities[path]) || (pack && pack.quality) || null;
	button.disabled = true;
	button.textContent = "sending…";
	toast("Sending " + short(path) + " to the phone…");
	try {
		const r = await (await fetch("/api/push", {method: "POST", body: JSON.stringify({path, quality})})).json();
		toast((r.ok ? "📱 " : "") + r.message, r.ok ? "good" : "bad");
	} catch (e) {
		toast("Couldn't send: " + e, "bad");
	}
	button.disabled = false;
	button.textContent = "📱 Send";
}

function packHead(pack) {
	const head = el("div", {class: "packhead"});
	const title = el("input", {class: "title", value: pack.title, oninput: () => {
		const auto = pack.id === slug(pack.title);
		pack.title = title.value;
		if (auto) { pack.id = slug(pack.title); id.value = pack.id; }
		changed();
		renderNav();
	}});
	const id = el("input", {value: pack.id, oninput: () => { pack.id = slug(id.value) || pack.id; changed(); }});
	const q = el("select", {onchange: () => {
			if (q.value === "") delete pack.quality; else pack.quality = +q.value;
			changed();
		}},
		el("option", {value: ""}, "default (" + fraction(state.default_quality) + ")"),
		...state.qualities.map(v => el("option", {value: String(v)}, fraction(v))));
	q.value = pack.quality != null ? String(pack.quality) : "";
	const remove = el("button", {title: "Its shaders go to Not in a pack", onclick: () => {
		if (!confirm("Delete the pack \"" + pack.title + "\"? Its " + pack.paths.length + " shaders go to Not in a pack.")) return;
		packs.splice(current, 1);
		current = Math.min(current, packs.length - 1);
		changed();
		render();
	}}, "Delete pack");
	head.append(el("label", {}, "Title", title), el("label", {}, "Id (the file's name)", id),
		el("label", {}, "Starts at", q), remove);
	const desc = el("textarea", {placeholder: "The blurb buyers see in Get Shader Pack (left empty, one's written for it)",
			oninput: () => { pack.description = desc.value; changed(); }});
	desc.value = pack.description || "";
	head.append(desc);
	return head;
}

function render() {
	renderNav();
	const main = $("#main");
	main.textContent = "";
	const query = $("#filter").value.trim().toLowerCase();
	const bar = el("div", {class: "selbar" + (selected.size ? " show" : "")},
		el("span", {}, selected.size + " selected - drag them onto a pack, or"),
		el("button", {onclick: () => { selected.clear(); render(); }}, "Clear selection"));
	main.append(bar);
	if (query) {
		const hits = Object.keys(files).filter(p => p.toLowerCase().includes(query) && !(p in state.duplicates)).sort();
		main.append(el("p", {class: "hint"}, hits.length + " shaders match \"" + query + "\" (in any pack)"));
		const grid = el("div", {class: "grid"});
		for (const p of hits.slice(0, 200)) {
			const i = packOf(p);
			const c = card(p, i >= 0 ? packs[i] : null);
			c.insertBefore(el("div", {class: "meta"}, "in: " + (i >= 0 ? packs[i].title : "Not in a pack")), c.children[1]);
			grid.append(c);
		}
		main.append(grid);
		return;
	}
	let paths, pack = null;
	if (current === UNASSIGNED || !packs[current]) {
		paths = unassigned();
		main.append(el("h2", {}, "Not in a pack"),
			el("p", {class: "hint"}, "Shaders no pack has - left out of the pack files. Drag them onto a pack to add them."));
	} else {
		pack = packs[current];
		paths = pack.paths;
		main.append(packHead(pack));
		const kinds = {};
		for (const p of paths) { const k = (files[p] || {}).kind || "pending"; kinds[k] = (kinds[k] || 0) + 1; }
		main.append(el("p", {class: "hint"},
			paths.length + " shaders (" + Object.entries(kinds).map(([k, n]) => n + " " + k).join(", ") + "). " +
			"Drag a card onto a pack on the left to move it; shift-click to pick several. Left-out ones are skipped when the pack's built."));
	}
	const grid = el("div", {class: "grid"});
	for (const p of paths) grid.append(card(p, pack));
	main.append(grid);
}

// Anything that goes wrong shows (and goes to the server's log), rather
// than leaving a blank page.
function failed(text) {
	const t = $("#toast");
	t.textContent = "⚠ " + text;
	t.className = "show bad";
	clearTimeout(toast.timer);
	fetch("/api/error", {method: "POST", body: JSON.stringify({text, agent: navigator.userAgent})}).catch(() => {});
}
window.addEventListener("error", e => failed(e.message + " (" + e.filename + ":" + e.lineno + ")"));
window.addEventListener("unhandledrejection", e => failed(String(e.reason && (e.reason.stack || e.reason))));

async function load() {
	for (let tries = 1; ; tries++) {
		try {
			const r = await fetch("/api/state");
			if (!r.ok) throw new Error("HTTP " + r.status);
			state = await r.json();
			break;
		} catch (e) {
			$("#stats").textContent = "couldn't load (" + e + "), trying again…";
			if (tries === 3) failed("Loading the packs: " + e);
			await new Promise(done => setTimeout(done, 2000));
		}
	}
	packs = state.packs;
	files = state.files;
	const asked = parseInt(location.hash.slice(1), 10);
	if (asked === UNASSIGNED || (asked >= 0 && asked < packs.length)) current = asked;
	const kinds = {};
	for (const f of Object.values(files)) kinds[f.kind] = (kinds[f.kind] || 0) + 1;
	$("#stats").textContent = Object.keys(files).length + " patterns · " + packs.length + " packs · " +
		(kinds.pending || 0) + " not built yet · " + (kinds.excluded || 0) + " left out";
	render();
}

$("#filter").addEventListener("input", () => { clearTimeout(render.t); render.t = setTimeout(render, 200); });
load();
</script>
</body>
</html>
